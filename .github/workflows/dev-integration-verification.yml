name: Dev Integration Verification
run-name: Integration verification #${{ inputs.pr_number }} ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Frozen pull request number
        required: true
        type: string
      candidate_head:
        description: Frozen candidate head commit
        required: true
        type: string
      dev_base:
        description: Frozen dev base commit
        required: true
        type: string
      gate:
        description: Frozen verification gate
        required: true
        type: choice
        options:
          - complete-behavioral
          - fast-non-runtime
      nonce:
        description: Coordinator run correlation value
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-frozen-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      browser-version: ${{ steps.browser-version.outputs.version }}
      catalog-after: ${{ steps.catalog-after.outputs.fingerprint }}
      catalog-before: ${{ steps.catalog-before.outputs.fingerprint }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}
      NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY }}
      NEXT_PUBLIC_ALGOLIA_INDEX_NAME: ${{ secrets.NEXT_PUBLIC_ALGOLIA_INDEX_NAME }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      VERIFICATION_CANDIDATE_CWD: ${{ github.workspace }}/candidate
      MEI_PELLE_VITE_CACHE_DIR: ${{ github.workspace }}/candidate/test-results/vite-cache
    steps:
      - name: Checkout trusted verification runner
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: trusted/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: trusted/.nvmrc
          cache: pnpm
          cache-dependency-path: trusted/pnpm-lock.yaml

      - name: Install trusted runner dependencies
        run: pnpm --dir trusted install --frozen-lockfile

      - name: Fetch the frozen pull-request head
        env:
          FROZEN_PULL_REQUEST: ${{ inputs.pr_number }}
        run: |
          case "$FROZEN_PULL_REQUEST" in
            ''|*[!0-9]*) echo "Frozen pull-request number must contain only digits." >&2; exit 1 ;;
          esac
          git -C trusted fetch --no-tags origin "refs/pull/$FROZEN_PULL_REQUEST/head"

      - name: Prepare the exact candidate and base in an isolated worktree
        run: >-
          pnpm --dir trusted exec tsx scripts/github/prepare-integration-candidate.ts
          --candidate-head "${{ inputs.candidate_head }}"
          --dev-base "${{ inputs.dev_base }}"
          --output "$GITHUB_WORKSPACE/candidate"

      - name: Isolate candidate execution from the audited runner
        run: |
          sudo useradd --create-home --shell /bin/bash verifier-candidate
          case "$GITHUB_WORKSPACE" in
            /home/runner/work/*/*) ;;
            *) echo "GitHub workspace is outside the expected hosted-runner tree." >&2; exit 1 ;;
          esac
          case "$VERIFICATION_CANDIDATE_CWD" in
            "$GITHUB_WORKSPACE"/candidate) ;;
            *) echo "Candidate workspace does not match the frozen candidate path." >&2; exit 1 ;;
          esac
          case "$PNPM_HOME" in
            /*/setup-pnpm/node_modules/.bin) ;;
            *) echo "pnpm runtime home is missing or outside the action-managed tree." >&2; exit 1 ;;
          esac
          pnpm_executable="$(command -v pnpm)"
          case "$pnpm_executable" in
            "$PNPM_HOME"/*) ;;
            *) echo "pnpm executable is outside the validated runtime home." >&2; exit 1 ;;
          esac
          node_executable="$(command -v node)"
          case "$node_executable" in
            /*/hostedtoolcache/node/*/x64/bin/node) ;;
            *) echo "Node executable is outside the action-managed tool cache." >&2; exit 1 ;;
          esac
          pnpm_runtime_root="${PNPM_HOME%/.bin}"
          test -d "$pnpm_runtime_root"
          sudo install -d -m 0755 /opt/mei-pelle-node-runtime/bin
          sudo install -o root -g root -m 0555 -- "$node_executable" /opt/mei-pelle-node-runtime/bin/node
          sudo install -d -m 0755 /opt/mei-pelle-pnpm-runtime
          sudo cp -a -- "$pnpm_runtime_root/." /opt/mei-pelle-pnpm-runtime/
          sudo chown -R root:root -- /opt/mei-pelle-pnpm-runtime
          sudo chmod -R a+rX -- /opt/mei-pelle-pnpm-runtime
          sudo chmod -R a-w -- /opt/mei-pelle-pnpm-runtime
          echo "/opt/mei-pelle-pnpm-runtime/.bin" >> "$GITHUB_PATH"
          candidate_path="/opt/mei-pelle-node-runtime/bin:/opt/mei-pelle-pnpm-runtime/.bin:/usr/local/bin:/usr/bin:/bin"
          echo "VERIFICATION_CANDIDATE_PATH=$candidate_path" >> "$GITHUB_ENV"
          sudo chmod o+x -- /home/runner
          sudo chown -R verifier-candidate:verifier-candidate candidate
          chmod -R a-w trusted
          test "$(stat -Lc '%u:%g' /opt/mei-pelle-pnpm-runtime/.bin/pnpm)" = 0:0
          test "$(stat -Lc '%u:%g' /opt/mei-pelle-node-runtime/bin/node)" = 0:0
          sudo -u verifier-candidate test -x /opt/mei-pelle-pnpm-runtime/.bin/pnpm
          sudo -u verifier-candidate test ! -w /opt/mei-pelle-pnpm-runtime/.bin/pnpm
          sudo -u verifier-candidate test -x /opt/mei-pelle-node-runtime/bin/node
          sudo -u verifier-candidate test ! -w /opt/mei-pelle-node-runtime/bin/node
          sudo -u verifier-candidate test -x "$GITHUB_WORKSPACE"
          sudo -u verifier-candidate test -d "$VERIFICATION_CANDIDATE_CWD"
          sudo -u verifier-candidate test ! -w trusted/scripts/github/verification-receipt-command.ts
          test "$(sudo -H -u verifier-candidate env "PATH=$candidate_path" node --version)" = "$(node --version)"

      - name: Install frozen candidate dependencies
        run: sudo -E -H -u verifier-candidate env "PATH=$VERIFICATION_CANDIDATE_PATH" pnpm --dir "$VERIFICATION_CANDIDATE_CWD" install --frozen-lockfile --store-dir "$VERIFICATION_CANDIDATE_CWD/.pnpm-store"

      - name: Freeze candidate dependencies and prove source integrity
        run: |
          sudo chown -R root:root candidate/node_modules
          sudo chmod -R a-w candidate/node_modules
          git -C candidate diff --exit-code
          test -z "$(git -C candidate status --short --untracked-files=all)"

      - name: Lint
        run: sudo -E -H -u verifier-candidate env "PATH=$VERIFICATION_CANDIDATE_PATH" pnpm --dir "$VERIFICATION_CANDIDATE_CWD" lint

      - name: Typecheck
        run: sudo -E -H -u verifier-candidate env "PATH=$VERIFICATION_CANDIDATE_PATH" pnpm --dir "$VERIFICATION_CANDIDATE_CWD" typecheck

      - name: Unit tests
        run: sudo -E -H -u verifier-candidate env "PATH=$VERIFICATION_CANDIDATE_PATH" pnpm --dir "$VERIFICATION_CANDIDATE_CWD" test

      - name: Recheck candidate source after untrusted commands
        run: |
          git -C candidate diff --exit-code
          test -z "$(git -C candidate status --short --untracked-files=all)"

      - name: Install Playwright browsers
        if: ${{ inputs.gate == 'complete-behavioral' }}
        run: |
          sudo -E pnpm --dir trusted exec playwright install-deps chromium
          sudo -E -H -u verifier-candidate env "PATH=$VERIFICATION_CANDIDATE_PATH" pnpm --dir "$VERIFICATION_CANDIDATE_CWD" exec playwright install chromium

      - name: Build receipted production artifact with the trusted runner
        if: ${{ inputs.gate == 'complete-behavioral' }}
        run: sudo -E -H -u verifier-candidate env "PATH=$VERIFICATION_CANDIDATE_PATH" pnpm --dir trusted exec tsx scripts/verify-production-ci.ts build

      - name: Freeze the receipted artifact before browser verification
        if: ${{ inputs.gate == 'complete-behavioral' }}
        run: |
          sudo chown -R root:root candidate/.next
          sudo chmod -R a-w candidate/.next
          sudo -u verifier-candidate test ! -w candidate/.next/BUILD_ID

      - name: Record Catalog fingerprint before verification with trusted code
        if: ${{ inputs.gate == 'complete-behavioral' }}
        id: catalog-before
        run: echo "fingerprint=$(sudo -E -H -u verifier-candidate env "PATH=$VERIFICATION_CANDIDATE_PATH" pnpm --dir trusted --silent verification:catalog-fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Verify receipted production artifact with the trusted runner
        if: ${{ inputs.gate == 'complete-behavioral' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/candidate/test-results/playwright-telemetry.json
          VERIFICATION_BROWSER_RESULT_PATH: ${{ github.workspace }}/candidate/test-results/verification-browser-result.json
        run: sudo -E -H -u verifier-candidate env "PATH=$VERIFICATION_CANDIDATE_PATH" pnpm --dir trusted exec tsx scripts/verify-production-ci.ts verify --selection routine-chromium

      - name: Require structured browser telemetry
        if: ${{ inputs.gate == 'complete-behavioral' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/candidate/test-results/playwright-telemetry.json
        run: test -s "$PLAYWRIGHT_JSON_OUTPUT_FILE"

      - name: Record Catalog fingerprint after verification with trusted code
        if: ${{ inputs.gate == 'complete-behavioral' }}
        id: catalog-after
        run: echo "fingerprint=$(sudo -E -H -u verifier-candidate env "PATH=$VERIFICATION_CANDIDATE_PATH" pnpm --dir trusted --silent verification:catalog-fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Record exact Chromium version
        if: ${{ inputs.gate == 'complete-behavioral' }}
        id: browser-version
        env:
          VERIFICATION_BROWSER_CWD: ${{ github.workspace }}/candidate
        run: sudo -E -H -u verifier-candidate env "PATH=$VERIFICATION_CANDIDATE_PATH" pnpm --dir trusted exec tsx scripts/github/verification-receipt-command.ts browser-version

      - name: Stage unprivileged build evidence
        if: ${{ inputs.gate == 'complete-behavioral' }}
        env:
          CATALOG_FINGERPRINT_AFTER: ${{ steps.catalog-after.outputs.fingerprint }}
          CATALOG_FINGERPRINT_BEFORE: ${{ steps.catalog-before.outputs.fingerprint }}
          VERIFICATION_BROWSER_VERSION: ${{ steps.browser-version.outputs.version }}
          VERIFICATION_BROWSER_RESULT_PATH: ${{ github.workspace }}/candidate/test-results/verification-browser-result.json
          VERIFICATION_EVIDENCE_PATH: ${{ runner.temp }}/verification-evidence/execution.json
        run: |
          git -C candidate diff --exit-code
          test -z "$(git -C candidate status --short --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/verification-evidence"
          pnpm --dir trusted exec tsx scripts/github/verification-receipt-command.ts evidence
          cp candidate/.next/BUILD_ID "$RUNNER_TEMP/verification-evidence/BUILD_ID"

      - name: Upload stable build evidence
        if: ${{ inputs.gate == 'complete-behavioral' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-build-evidence-${{ inputs.pr_number }}-${{ inputs.nonce }}
          path: ${{ runner.temp }}/verification-evidence/
          retention-days: 1

      - name: Upload successful browser report and telemetry
        if: ${{ success() && inputs.gate == 'complete-behavioral' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-playwright-success-${{ inputs.pr_number }}-${{ inputs.nonce }}
          path: |
            candidate/playwright-report/
            candidate/test-results/playwright-telemetry.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload failed browser diagnostics
        if: ${{ failure() && inputs.gate == 'complete-behavioral' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-playwright-failure-${{ inputs.pr_number }}-${{ inputs.nonce }}
          path: |
            candidate/playwright-report/
            candidate/test-results/
            candidate/test-results/playwright-telemetry.json
          retention-days: 90
          if-no-files-found: ignore

  attest-stable-result:
    if: ${{ inputs.gate == 'complete-behavioral' }}
    needs: verify-frozen-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}
      NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY }}
      NEXT_PUBLIC_ALGOLIA_INDEX_NAME: ${{ secrets.NEXT_PUBLIC_ALGOLIA_INDEX_NAME }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      VERIFICATION_BROWSER_VERSION: ${{ needs.verify-frozen-candidate.outputs.browser-version }}
      VERIFICATION_CANDIDATE_CWD: ${{ github.workspace }}/candidate
      VERIFICATION_CANDIDATE_SHA: ${{ inputs.candidate_head }}
      VERIFICATION_DEV_BASE: ${{ inputs.dev_base }}
      VERIFICATION_PULL_REQUEST: ${{ inputs.pr_number }}
      VERIFICATION_WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout audited signer from dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: trusted/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: trusted/.nvmrc
          cache: pnpm
          cache-dependency-path: trusted/pnpm-lock.yaml

      - name: Install audited signer dependencies
        run: pnpm --dir trusted install --frozen-lockfile --ignore-scripts

      - name: Fetch the frozen pull-request head
        env:
          FROZEN_PULL_REQUEST: ${{ inputs.pr_number }}
        run: |
          case "$FROZEN_PULL_REQUEST" in
            ''|*[!0-9]*) echo "Frozen pull-request number must contain only digits." >&2; exit 1 ;;
          esac
          git -C trusted fetch --no-tags origin "refs/pull/$FROZEN_PULL_REQUEST/head"

      - name: Materialize candidate as non-executable input
        run: >-
          pnpm --dir trusted exec tsx scripts/github/prepare-integration-candidate.ts
          --candidate-head "${{ inputs.candidate_head }}"
          --dev-base "${{ inputs.dev_base }}"
          --output "$GITHUB_WORKSPACE/candidate"

      - name: Download unprivileged build evidence
        uses: actions/download-artifact@v4
        with:
          name: integration-build-evidence-${{ inputs.pr_number }}-${{ inputs.nonce }}
          path: ${{ runner.temp }}/verification-evidence

      - name: Attach build identity without executing candidate code
        run: |
          mkdir -p candidate/.next
          cp "$RUNNER_TEMP/verification-evidence/BUILD_ID" candidate/.next/BUILD_ID

      - name: Re-read current Catalog with audited code
        id: catalog-current
        run: echo "fingerprint=$(pnpm --dir trusted --silent verification:catalog-fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Prepare canonical Verification Receipt with audited code
        id: receipt
        env:
          VERIFICATION_EVIDENCE_PATH: ${{ runner.temp }}/verification-evidence/execution.json
          CATALOG_FINGERPRINT_AFTER: ${{ needs.verify-frozen-candidate.outputs.catalog-after }}
          CATALOG_FINGERPRINT_BEFORE: ${{ needs.verify-frozen-candidate.outputs.catalog-before }}
          CATALOG_FINGERPRINT_CURRENT: ${{ steps.catalog-current.outputs.fingerprint }}
        run: pnpm --dir trusted verification:receipt:prepare

      - name: Sign Verification Receipt
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.receipt.outputs.subject_path }}
          predicate-type: https://mei-pelle.com/attestations/browser-verification/v1
          predicate-path: ${{ steps.receipt.outputs.predicate_path }}

      - name: Verify signature and independently reconstructed current inputs
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          CATALOG_FINGERPRINT_CURRENT: ${{ steps.catalog-current.outputs.fingerprint }}
          VERIFICATION_BROWSER_VERSION: ${{ steps.receipt.outputs.browser_version }}
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_SUBJECT_PATH: ${{ steps.receipt.outputs.subject_path }}
        run: pnpm --dir trusted verification:receipt:verify
