name: Production Promotion

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan first, then separately promote the unchanged plan
        required: true
        type: choice
        options:
          - plan
          - promote
      staged_run_id:
        description: Staged Production Verification run containing the signed receipt
        required: true
        type: string
      attestation_id:
        description: Exact signed Production Receipt attestation
        required: true
        type: string
      deployment_id:
        description: Exact inspected staged Vercel deployment
        required: true
        type: string
      inspection_url:
        description: Exact deployment URL inspected by the user
        required: true
        type: string
      authorization:
        description: Exact challenge printed by a prior unchanged plan; required only for promote
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ inputs.operation == 'plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      checks: read
      contents: read
      issues: read
      pull-requests: write
    env: &release-env
      GH_TOKEN: ${{ github.token }}
      NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}
      NEXT_PUBLIC_ALGOLIA_INDEX_NAME: ${{ secrets.NEXT_PUBLIC_ALGOLIA_INDEX_NAME }}
      NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout current dev release tooling and source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium webkit
      - name: Download exact staged Production Receipt
        env:
          STAGED_RUN_ID: ${{ inputs.staged_run_id }}
        run: gh run download "$STAGED_RUN_ID" --name "staged-production-release-evidence-$STAGED_RUN_ID" --dir "$RUNNER_TEMP/production-release"
      - name: Present immutable Production release plan
        env:
          ATTESTATION_ID: ${{ inputs.attestation_id }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          INSPECTION_URL: ${{ inputs.inspection_url }}
        run: >-
          pnpm production:release -- plan
          --attestation-id "$ATTESTATION_ID"
          --attestation-metadata-path "$RUNNER_TEMP/production-release/attestation.json"
          --bundle-path "$RUNNER_TEMP/production-release/attestation-bundle.json"
          --deployment-id "$DEPLOYMENT_ID"
          --inspection-url "$INSPECTION_URL"
          --receipt-path "$RUNNER_TEMP/production-release/receipt.json"
          --output-path "$RUNNER_TEMP/production-release/plan.json"

  promote:
    if: ${{ inputs.operation == 'promote' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    permissions:
      actions: read
      attestations: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    env: *release-env
    steps:
      - name: Checkout current dev release tooling and source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium webkit
      - name: Download exact staged Production Receipt
        env:
          STAGED_RUN_ID: ${{ inputs.staged_run_id }}
        run: gh run download "$STAGED_RUN_ID" --name "staged-production-release-evidence-$STAGED_RUN_ID" --dir "$RUNNER_TEMP/production-release"
      - name: Regular-merge and promote the exact authorized deployment
        env:
          ATTESTATION_ID: ${{ inputs.attestation_id }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          INSPECTION_URL: ${{ inputs.inspection_url }}
          PRODUCTION_AUTHORIZATION: ${{ inputs.authorization }}
        run: >-
          pnpm production:release -- promote
          --attestation-id "$ATTESTATION_ID"
          --attestation-metadata-path "$RUNNER_TEMP/production-release/attestation.json"
          --bundle-path "$RUNNER_TEMP/production-release/attestation-bundle.json"
          --deployment-id "$DEPLOYMENT_ID"
          --inspection-url "$INSPECTION_URL"
          --receipt-path "$RUNNER_TEMP/production-release/receipt.json"
          --output-path "$RUNNER_TEMP/production-release/audit.json"
      - name: Retain immutable promotion audit for rollback
        uses: actions/upload-artifact@v4
        with:
          name: production-promotion-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/production-release/audit.json
          retention-days: 90
          if-no-files-found: error
      - name: Retain post-mutation recovery audit after a failed promotion
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-promotion-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/production-release/audit.json
          retention-days: 90
          if-no-files-found: ignore
