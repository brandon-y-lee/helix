name: Development preview

on:
  push:
    branches: [dev]

permissions: {}

jobs:
  sync:
    if: github.repository == 'brandon-y-lee/helix' && github.ref == 'refs/heads/dev' && github.ref_protected && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    concurrency:
      group: helix-dev-preview
      cancel-in-progress: false
    steps:
      - name: Fast-forward the isolated Vercel preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git_api="repos/$GITHUB_REPOSITORY/git"
          preview_ref="heads/codex/558-verified-dev-preview"
          dev_sha="$(gh api "$git_api/ref/heads/dev" --jq '.object.sha')"
          if [[ "$dev_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer dev push owns the preview."
            exit 0
          fi
          preview_sha="$(gh api "$git_api/ref/$preview_ref" --jq '.object.sha')"
          if [[ "$preview_sha" != "$dev_sha" ]]; then
            updated="$(gh api --method PATCH "$git_api/refs/$preview_ref" -f sha="$dev_sha" -F force=false --jq '.object.sha')"
            [[ "$updated" == "$dev_sha" ]]
          fi
          printf 'Vercel preview branch at `%s`. [Open the development shop after its Vercel build finishes](https://helix-git-codex-558-verified-e87038-brandons-projects-5060bad5.vercel.app/collections/shop).\n' "$dev_sha" >> "$GITHUB_STEP_SUMMARY"
