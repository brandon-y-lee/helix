name: Production domain hold

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  check:
    if: >-
      github.repository == 'brandon-y-lee/helix' && github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev'
    environment: helix-release-inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # The trusted target workflow executes only its own protected base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify exact dev head and that Production domains are held
        id: hold
        env:
          RELEASE_PR: ${{ github.event.pull_request.number }}
          RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          HELIX_RELEASE_VERCEL_TOKEN: ${{ secrets.HELIX_RELEASE_VERCEL_READ_TOKEN }}
        run: node scripts/release/command.mjs premerge
      - name: Report hold on the exact head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ steps.hold.outcome }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" -f context=helix-production-domain-hold -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
