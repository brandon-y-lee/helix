name: Verification Lifecycle Windows

on:
  pull_request:
    branches: [dev, main]
    paths:
      - ".github/workflows/**"
      - "scripts/github/**"
      - "scripts/affected-browser-verification*"
      - "scripts/browser-verification-plan*"
      - "scripts/production-verification*"
      - "scripts/verify-affected*"
      - "scripts/verify-production*"
      - "tests/affected-browser-verification*"
      - "tests/integration-workflow*"
      - "tests/production-verification*"
      - "tests/scheduled-*"
      - "tests/verification-orchestrator*"
      - "e2e/**"
      - "playwright-global-setup.ts"
      - "test-support/**"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.ts"
      - "tsconfig.json"
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification-lifecycle-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lifecycle start, failure, interruption, and cleanup
        env:
          WINDOWS_LIFECYCLE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WINDOWS_LIFECYCLE_SOURCE: ${{ github.event_name }}
        run: pnpm verification:lifecycle:windows
