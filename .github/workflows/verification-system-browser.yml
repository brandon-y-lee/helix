name: Verification System Browser Evidence

on:
  pull_request:
    branches: [dev, main, "codex/spec-*"]

permissions:
  contents: read

jobs:
  classify-verification-system:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
    steps:
      - name: Checkout history for browser classification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select relevant verification-system changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if ! relevant="$(node scripts/github/verification-system-paths.mjs "$RUNNER_TEMP/changed-files.txt")"; then
            echo "Verification-system browser classification failed." >&2
            exit 1
          fi
          if [[ "$relevant" != "true" && "$relevant" != "false" ]]; then
            echo "Verification-system browser classification returned an invalid result." >&2
            exit 1
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  complete-browser-evidence:
    needs: classify-verification-system
    if: ${{ needs.classify-verification-system.outputs.relevant == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}
      NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY }}
      NEXT_PUBLIC_ALGOLIA_INDEX_NAME: ${{ secrets.NEXT_PUBLIC_ALGOLIA_INDEX_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and WebKit
        run: pnpm exec playwright install chromium webkit

      - name: Verify affected browser behavior
        run: pnpm verify:affected -- --base "origin/${{ github.base_ref }}"

      - name: Upload successful browser report
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-system-browser-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload failed browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-system-browser-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 90
          if-no-files-found: ignore

  verification-system-browser-gate:
    needs: [classify-verification-system, complete-browser-evidence]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLASSIFIER_RESULT: ${{ needs.classify-verification-system.result }}
      BROWSER_RELEVANT: ${{ needs.classify-verification-system.outputs.relevant }}
      BROWSER_RESULT: ${{ needs.complete-browser-evidence.result }}
    steps:
      - name: Require proportional complete browser evidence
        run: |
          if [[ "$CLASSIFIER_RESULT" != "success" ]]; then
            echo "Verification-system browser classification must succeed." >&2
            exit 1
          fi
          if [[ "$BROWSER_RELEVANT" == "true" && "$BROWSER_RESULT" != "success" ]]; then
            echo "Relevant verification-system changes require complete browser evidence." >&2
            exit 1
          fi
