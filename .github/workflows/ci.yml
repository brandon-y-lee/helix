name: CI

permissions:
  contents: read

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main, "codex/spec-*"]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel only superseded work for the same pull request or protected ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ticket-verification:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.base_ref, 'codex/spec-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Complete Vitest suite
        run: pnpm test

  ticket-gate:
    needs: ticket-verification
    if: ${{ always() && github.event_name == 'pull_request' && startsWith(github.base_ref, 'codex/spec-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Report Ticket Gate
        env:
          VERIFICATION_RESULT: ${{ needs.ticket-verification.result }}
        run: test "$VERIFICATION_RESULT" == 'success'

  integration-verification:
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.base_ref, 'codex/spec-') && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}
      NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY }}
      NEXT_PUBLIC_ALGOLIA_INDEX_NAME: ${{ secrets.NEXT_PUBLIC_ALGOLIA_INDEX_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Complete Vitest suite
        run: pnpm test

      - name: Install Playwright browsers
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Build receipted production artifact
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm tsx scripts/verify-production-ci.ts build

      - name: Verify receipted production artifact
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm tsx scripts/verify-production-ci.ts verify

      - name: Upload Playwright report
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  integration-gate:
    needs: integration-verification
    if: ${{ always() && github.event_name == 'pull_request' && !startsWith(github.base_ref, 'codex/spec-') && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Report Integration Gate
        env:
          VERIFICATION_RESULT: ${{ needs.integration-verification.result }}
        run: test "$VERIFICATION_RESULT" == 'success'

  # Compatibility context retained only for the bootstrap transition. Ticket #209
  # removes it after integration-gate is proven and required by live protection.
  ci:
    needs: integration-verification
    if: ${{ always() && (github.event_name == 'push' || (!startsWith(github.base_ref, 'codex/spec-') && github.event.pull_request.draft == false)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout protected push
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4

      - name: Install pnpm for protected push
        if: ${{ github.event_name == 'push' }}
        uses: pnpm/action-setup@v4

      - name: Set up Node for protected push
        if: ${{ github.event_name == 'push' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies for protected push
        if: ${{ github.event_name == 'push' }}
        run: pnpm install --frozen-lockfile

      - name: Lint protected push
        if: ${{ github.event_name == 'push' }}
        run: pnpm lint

      - name: Typecheck protected push
        if: ${{ github.event_name == 'push' }}
        run: pnpm typecheck

      - name: Test protected push
        if: ${{ github.event_name == 'push' }}
        run: pnpm test

      - name: Report compatibility Integration Gate
        if: ${{ github.event_name == 'pull_request' }}
        env:
          VERIFICATION_RESULT: ${{ needs.integration-verification.result }}
        run: test "$VERIFICATION_RESULT" == 'success'
